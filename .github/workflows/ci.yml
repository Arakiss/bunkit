# =============================================================================
# bunkit CI Pipeline
# =============================================================================
# Validates code quality on every push and PR.
# Called by the Release workflow as a prerequisite for publishing.
# =============================================================================

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:

permissions:
  contents: read
  pull-requests: write

env:
  BUN_VERSION: '1.3.9'

jobs:
  # ===========================================================================
  # Code Quality & Build
  # ===========================================================================
  quality:
    name: Lint, Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check for test.only() in tests
        run: |
          if grep -r "test\.only\|it\.only\|describe\.only" --include="*.test.ts" --include="*.test.tsx" . 2>/dev/null; then
            echo "::error::Found test.only() in tests. Remove them before committing."
            exit 1
          fi

      - name: Lint (Biome)
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Test
        run: bun test

      - name: Report build size
        if: always()
        run: |
          echo "## Build Artifacts" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          du -sh packages/*/dist 2>/dev/null || echo "No dist directories"
          du -sh packages/*/dist 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "No dist directories" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Commit Message Lint (PRs only)
  # ===========================================================================
  commitlint:
    name: Commit Messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate commit messages
        run: |
          npm install --save-dev @commitlint/cli @commitlint/config-conventional
          cat > commitlint.config.cjs << 'COMMITLINT_EOF'
          module.exports = {
            extends: ['@commitlint/config-conventional'],
            rules: {
              'type-enum': [2, 'always', [
                'feat', 'fix', 'docs', 'style', 'refactor',
                'perf', 'test', 'build', 'ci', 'chore', 'revert'
              ]],
              'scope-enum': [1, 'always', [
                'cli', 'core', 'templates', 'generators',
                'docs', 'ci', 'deps', 'release', 'test', 'config'
              ]],
              'subject-case': [0],
              'body-max-line-length': [0],
              'header-max-length': [0]
            }
          };
          COMMITLINT_EOF
          npx commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose

  # ===========================================================================
  # PR Status Summary
  # ===========================================================================
  summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [quality, commitlint]
    if: github.event_name == 'pull_request' && always()

    steps:
      - name: Summary
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint, Build & Test | ${{ needs.quality.result == 'success' && 'Passed' || 'Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit Messages | ${{ needs.commitlint.result == 'success' && 'Passed' || 'Skipped' }} |" >> $GITHUB_STEP_SUMMARY
